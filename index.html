<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Real-Time Facial Expression Detection</title>

  <!-- face-api.js -->
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js">
  </script>

  <!-- Chart.js -->
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js">
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 30px;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 10px;
    }

    #status {
      margin-bottom: 20px;
      color: #555;
    }

    video {
      width: 100%;
      max-width: 640px;
      border-radius: 12px;
      background: #222;
    }

    .chart-container {
      max-width: 700px;
      margin: 30px auto 0;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <h1>Facial Expression Detection</h1>
  <p id="status">Loading models...</p>

  <video
    id="video"
    width="640"
    height="480"
    autoplay
    muted
    playsinline>
  </video>

  <div class="chart-container">
    <canvas id="emotionChart"></canvas>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      const video = document.getElementById("video");
      const status = document.getElementById("status");

      // -------------------------------------------------------
      // 1. Create Chart.js chart
      // -------------------------------------------------------

      const emotions = [
        "neutral",
        "happy",
        "sad",
        "angry",
        "fearful",
        "disgusted",
        "surprised"
      ];

      const ctx = document
        .getElementById("emotionChart")
        .getContext("2d");

      const emotionChart = new Chart(ctx, {
        type: "bar",

        data: {
          labels: emotions,

          datasets: [{
            label: "Expression probability",
            data: [0, 0, 0, 0, 0, 0, 0],

            backgroundColor: [
              "#607d8b",
              "#4caf50",
              "#2196f3",
              "#f44336",
              "#9c27b0",
              "#795548",
              "#ff9800"
            ]
          }]
        },

        options: {
          responsive: true,

          animation: false,

          scales: {
            y: {
              beginAtZero: true,
              max: 1,

              title: {
                display: true,
                text: "Probability"
              }
            }
          },

          plugins: {
            legend: {
              display: false
            }
          }
        }
      });


      // -------------------------------------------------------
      // 2. Load face-api.js models
      // -------------------------------------------------------

      try {
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri("./models"),
          faceapi.nets.faceExpressionNet.loadFromUri("./models")
        ]);

        status.textContent = "Models loaded. Starting camera...";

        startCamera();

      } catch (error) {
        console.error(error);

        status.textContent =
          "Could not load face-api.js models. Check the /models folder.";
      }


      // -------------------------------------------------------
      // 3. Start webcam
      // -------------------------------------------------------

      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });

          video.srcObject = stream;

        } catch (error) {
          console.error(error);

          status.textContent =
            "Could not access webcam. Please allow camera permission.";
        }
      }


      // -------------------------------------------------------
      // 4. Start detection once video is ready
      // -------------------------------------------------------

      video.addEventListener("playing", () => {

        status.textContent = "Detecting facial expressions...";

        detectExpressions();
      });


      // -------------------------------------------------------
      // 5. Detection loop
      // -------------------------------------------------------

      async function detectExpressions() {

        try {
          const result = await faceapi
            .detectSingleFace(
              video,

              new faceapi.TinyFaceDetectorOptions({
                inputSize: 224,
                scoreThreshold: 0.5
              })
            )
            .withFaceExpressions();


          if (result) {

            const expressions = result.expressions;

            // Put probabilities into the same order
            // as our Chart.js labels.

            const values = emotions.map(
              emotion => expressions[emotion]
            );

            emotionChart.data.datasets[0].data = values;

            // "none" prevents animation on every update
            emotionChart.update("none");

            // Find the highest-scoring expression
            const dominantEmotion = emotions.reduce(
              (best, emotion) =>
                expressions[emotion] > expressions[best]
                  ? emotion
                  : best
            );

            status.textContent =
              `Detected expression: ${dominantEmotion} ` +
              `(${(expressions[dominantEmotion] * 100).toFixed(1)}%)`;

          } else {

            status.textContent = "No face detected";

            // Reset graph
            emotionChart.data.datasets[0].data =
              emotions.map(() => 0);

            emotionChart.update("none");
          }

        } catch (error) {
          console.error("Detection error:", error);
        }

        // Throttle inference so we don't try to run a model
        // on every video frame.
        setTimeout(detectExpressions, 150);
      }

    });
  </script>

</body>
</html>
