<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Real-Time Facial Expression Detection</title>

  <!-- face-api.js -->
  <script defer="" src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js">
  </script>

  <!-- Chart.js -->
  <script defer="" src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js">
  </script>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    body {
      padding: 16px;
    }

    h1 {
      margin: 0 0 4px;
      text-align: center;
      font-size: 24px;
    }

    #status {
      margin: 0 0 12px;
      text-align: center;
      color: #555;
      font-size: 14px;
    }

    .main-layout {
      display: flex;
      gap: 16px;

      width: 100%;
      height: calc(100vh - 75px);

      align-items: center;
      justify-content: center;
    }

    .video-panel,
    .chart-panel {
      flex: 1 1 0;
      min-width: 0;
      height: 100%;
    }

    .video-panel {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      display: block;

      width: 100%;
      height: 100%;

      max-width: 100%;
      max-height: 100%;

      object-fit: contain;

      border-radius: 12px;
      background: #222;
    }

    .chart-panel {
      display: flex;
      align-items: center;
      justify-content: center;

      background: white;
      padding: 16px;
      border-radius: 12px;

      overflow: hidden;
    }

    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    #emotionChart {
      width: 100% !important;
      height: 100% !important;
    }

    /* Slightly tighter layout for smaller iPads */
    @media (max-width: 900px) {
      body {
        padding: 10px;
      }

      .main-layout {
        gap: 10px;
        height: calc(100vh - 65px);
      }

      h1 {
        font-size: 20px;
      }

      #status {
        font-size: 13px;
        margin-bottom: 8px;
      }

      .chart-panel {
        padding: 10px;
      }
    }
  </style>

</head>

<body>


  <h1>Facial Expression Detection</h1>
  <p id="status">Could not access webcam. Please allow camera permission.</p>

  <div class="main-layout">

    <!-- LEFT: Webcam -->
    <div class="video-panel">
      <video id="video" width="640" height="480" autoplay="" muted="" playsinline="">
      </video>
    </div>

    <!-- RIGHT: Emotion chart -->
    <div class="chart-panel">
      <div class="chart-wrapper">
        <canvas id="emotionChart" width="944" height="1244" style="display: block; box-sizing: border-box; height: 622px; width: 472px;"></canvas>
      </div>
    </div>

  </div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      const video = document.getElementById("video");
      const status = document.getElementById("status");

      // -------------------------------------------------------
      // 1. Create Chart.js chart
      // -------------------------------------------------------

      const emotions = [
        "neutral",
        "happy",
        "sad",
        "angry",
        "fearful",
        "disgusted",
        "surprised"
      ];

      const ctx = document
        .getElementById("emotionChart")
        .getContext("2d");

      const emotionChart = new Chart(ctx, {
        type: "bar",

        data: {
          labels: emotions,

          datasets: [{
            label: "Expression probability",
            data: [0, 0, 0, 0, 0, 0, 0],

            backgroundColor: [
              "#607d8b",
              "#4caf50",
              "#2196f3",
              "#f44336",
              "#9c27b0",
              "#795548",
              "#ff9800"
            ]
          }]
        },

        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,

          scales: {
            y: {
              beginAtZero: true,
              max: 1,

              title: {
                display: true,
                text: "Probability"
              }
            }
          },

          plugins: {
            legend: {
              display: false
            }
          }
        }
      });


      // -------------------------------------------------------
      // 2. Load face-api.js models
      // -------------------------------------------------------

      try {
        await Promise.all([
          faceapi.nets.tinyFaceDetector.loadFromUri("./models"),
          faceapi.nets.faceExpressionNet.loadFromUri("./models")
        ]);

        status.textContent = "Models loaded. Starting camera...";

        startCamera();

      } catch (error) {
        console.error(error);

        status.textContent =
          "Could not load face-api.js models. Check the /models folder.";
      }


      // -------------------------------------------------------
      // 3. Start webcam
      // -------------------------------------------------------

      async function startCamera() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });

          video.srcObject = stream;

        } catch (error) {
          console.error(error);

          status.textContent =
            "Could not access webcam. Please allow camera permission.";
        }
      }


      // -------------------------------------------------------
      // 4. Start detection once video is ready
      // -------------------------------------------------------

      video.addEventListener("playing", () => {

        status.textContent = "Detecting facial expressions...";

        detectExpressions();
      });


      // -------------------------------------------------------
      // 5. Detection loop
      // -------------------------------------------------------

      async function detectExpressions() {

        try {
          const result = await faceapi
            .detectSingleFace(
              video,

              new faceapi.TinyFaceDetectorOptions({
                inputSize: 224,
                scoreThreshold: 0.5
              })
            )
            .withFaceExpressions();


          if (result) {

            const expressions = result.expressions;

            // Put probabilities into the same order
            // as our Chart.js labels.

            const values = emotions.map(
              emotion => expressions[emotion]
            );

            emotionChart.data.datasets[0].data = values;

            // "none" prevents animation on every update
            emotionChart.update("none");

            // Find the highest-scoring expression
            const dominantEmotion = emotions.reduce(
              (best, emotion) =>
                expressions[emotion] > expressions[best]
                  ? emotion
                  : best
            );

            status.textContent =
              `Detected expression: ${dominantEmotion} ` +
              `(${(expressions[dominantEmotion] * 100).toFixed(1)}%)`;

          } else {

            status.textContent = "No face detected";

            // Reset graph
            emotionChart.data.datasets[0].data =
              emotions.map(() => 0);

            emotionChart.update("none");
          }

        } catch (error) {
          console.error("Detection error:", error);
        }

        // Throttle inference so we don't try to run a model
        // on every video frame.
        setTimeout(detectExpressions, 150);
      }

    });
  </script>



</body></html>
